# The integration half of B4-C4: every change is built, linted and tested before
# it can reach the main branch.
# Block: B4.
# Lot: B4-L2.
# Competency: B4-C4.
# Covers: B4-EC24, B4-EC25, B4-EC26.
#
# WHAT MAKES THIS BLOCKING is not this file. A workflow only produces a check;
# refusing a merge on a red check is a branch protection rule, set on the
# repository. Both are needed for B4-EC26.
name: CI

on:
  push:
  pull_request:
  # THE ROLLBACK (B4-L6, B4-EC27): run this workflow by hand from the Actions
  # tab, give it a tag already in the registry, and the deploy job puts that
  # image back in service -- with the same checks as a deployment, and a line
  # in the same journal. Nothing is rebuilt: the image of a past commit is the
  # one that was tested and published then.
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to put back in service (sha-<7 hex>, see runtime/deployments/deployments.csv)"
        required: true
        type: string

# LEAST PRIVILEGE BY DEFAULT: every job reads the repository and nothing else,
# and the one job that writes -- the image, to the registry -- says so itself.
permissions:
  contents: read

jobs:
  tests:
    # A rollback tests nothing and builds nothing: it redeploys an image that
    # passed both when its commit reached main.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 3.11, like the images -- apache/airflow:2.10.4-python3.11 and
      # python:3.11 -- and like requires-python in pyproject.toml. A suite run
      # on a newer interpreter than production tests something else: the local
      # run under 3.14 is what sent us looking for a missing psycopg.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # THE DECLARED DEPENDENCIES ARE THE CONTRACT: psycopg, pandas, requests
      # and PyYAML, plus pytest and ruff. No airflow, no mlflow, no
      # scikit-learn -- ml4fd/ imports those inside the functions that need
      # them, so importing a module does not pull them in. If that ever
      # changes, this step is where it will be noticed.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # LF IS LOAD-BEARING: see .gitattributes. That file should keep CRLF out
      # of the repository; this step fails the build if it ever gets through,
      # because the symptom appears far from the cause -- a cluster missing two
      # databases, hours later.
      - name: Shell scripts keep their LF endings
        run: |
          if grep -rlU $'\r' sql/initdb/; then
            echo "CRLF found under sql/initdb/ -- see .gitattributes"
            exit 1
          fi

      # python -m pytest, not pytest: the module form puts the working
      # directory on sys.path, which is what makes `import ml4fd` resolve from
      # a checkout. fd-manager.ps1 test does the same.
      - name: Tests
        run: python -m pytest -q

  # THE IMAGE OF THE SCORING SERVICE (B4-L6), built after the tests and never
  # instead of them: a red test publishes nothing, so nothing red is deployed.
  #
  # BUILT ON EVERY RUN, PUBLISHED FROM main ONLY. A pull request builds the
  # image without pushing it, which is enough to catch a broken Dockerfile
  # before the merge -- the failure L5 met live, at start-up. A push to main
  # also publishes it to GHCR, GitHub's registry, authenticated by the
  # GITHUB_TOKEN the run is given: no secret is created by hand (B4-EC29).
  #
  # TWO TAGS. sha-<short commit> names the image for good, and is what a
  # deployment and a rollback point at; main moves with the branch. The FULL
  # commit goes into the image (GIT_SHA), which /health announces: the tag is
  # for people, the revision is for the check that a deployment landed.
  image:
    needs: tests
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry path follows the repository's, which GHCR requires in
      # lower case -- and this repository's name already is.
      - name: Name the image
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY}/scoring-service" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build, and publish from main
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scoring_service/Dockerfile
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ steps.name.outputs.short }}
            ${{ steps.name.outputs.image }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # THE DEPLOYMENT (B4-L6), on THIS MACHINE and nowhere else: GitHub cannot
  # reach a desktop, so a runner installed here takes the job (label
  # ml4fd-host, started by hand with run.cmd). It runs after the image is
  # published, from main only -- a pull request never runs code on this
  # machine.
  #
  # WHAT IT REPLACES: the scoring service's container, and only it
  # (--no-deps). The rest of the stack -- the database, MLflow, Airflow --
  # is state or is built here, and is not this job's to touch.
  #
  # WHERE: the stack's own folder, named by the repository variable
  # ML4FD_HOST_DIRPATH. The runner works in a folder of its own, from which
  # compose would find neither .env nor ./runtime/datasets.
  #
  # A DEPLOYMENT THAT IS NOT CHECKED IS ONLY A COMMAND THAT RAN: the job fails
  # unless /health announces the very commit it was asked to deploy.
  deploy:
    needs: image
    # TWO WAYS IN. A push on main deploys the image just published, and only
    # if it was. A manual run (the rollback) deploys the tag it was given; its
    # image job is skipped, and !cancelled() keeps a skipped need from
    # skipping this job too.
    if: >-
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.result == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: [self-hosted, ml4fd-host]
    # One deployment at a time on this machine; a second waits its turn.
    concurrency:
      group: deploy-ml4fd-host
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HOST_DIR: ${{ vars.ML4FD_HOST_DIRPATH }}
      IMAGE: ghcr.io/${{ github.repository }}/scoring-service
      # The tag asked for by hand goes through env, never into the script
      # text: an input is data, and the step validates it before use.
      INPUT_TAG: ${{ inputs.tag }}
      PUSHED_SHA: ${{ github.sha }}
      HEALTH_URL: http://127.0.0.1:8012/health
    defaults:
      run:
        shell: powershell
    steps:
      - name: The stack folder is declared and holds the stack
        run: |
          if (-not $env:HOST_DIR) {
            Write-Host "::error::repository variable ML4FD_HOST_DIRPATH is not set"
            exit 1
          }
          foreach ($name in @('docker-compose.yml', '.env')) {
            if (-not (Test-Path (Join-Path $env:HOST_DIR $name))) {
              Write-Host "::error::$name not found in $env:HOST_DIR"
              exit 1
            }
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = "$env:INPUT_TAG".Trim()
            if ($tag -notmatch '^sha-[0-9a-f]{7}$') {
              Write-Host "::error::tag '$tag' is not of the form sha-<7 hex digits>"
              exit 1
            }
          } else {
            $tag = 'sha-' + $env:PUSHED_SHA.Substring(0, 7)
          }
          # ASCII and not utf8: Windows PowerShell writes a BOM with utf8, and a
          # BOM at the head of GITHUB_ENV would become part of the variable name.
          Add-Content -Path $env:GITHUB_ENV -Value "SCORING_SERVICE_TAG=$tag" -Encoding ascii

      # THE OFFICIAL ACTION, as in the image job, and not a pipe into
      # docker login: the first deployment (2026-11-22) failed there with
      # "denied: denied". Windows PowerShell 5.1 hands a piped string to a
      # native program with an encoding and line endings of its own, and the
      # registry refused what reached it. The action passes the token itself,
      # and logs out on its own when the job ends.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        run: |
          docker compose --project-directory $env:HOST_DIR -f (Join-Path $env:HOST_DIR 'docker-compose.yml') pull scoring-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # THE EXPECTED REVISION COMES FROM THE IMAGE, not from the run: a
      # rollback runs on today's commit but deploys yesterday's image. The
      # image job wrote the full commit into the OCI label at build time. On
      # a push, the label must also be the commit just pushed.
      - name: Read the commit the image was built from
        run: |
          $ref = "{0}:{1}" -f $env:IMAGE, $env:SCORING_SERVICE_TAG
          $meta = (docker image inspect $ref) -join "`n" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $meta) {
            Write-Host "::error::image $ref not found after the pull"
            exit 1
          }
          $revision = $meta[0].Config.Labels.'org.opencontainers.image.revision'
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            Write-Host "::error::image $ref carries no commit in its revision label ('$revision')"
            exit 1
          }
          if (-not $revision.StartsWith($env:SCORING_SERVICE_TAG.Substring(4))) {
            Write-Host "::error::image $ref was built from $revision, which its tag contradicts"
            exit 1
          }
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -and $revision -ne $env:PUSHED_SHA) {
            Write-Host "::error::image $ref was built from $revision, expected $env:PUSHED_SHA"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "REVISION=$revision" -Encoding ascii
          Write-Host "deploying $ref, built from $revision"

      # THE TAG IS WRITTEN INTO .env, and not only into this process: compose
      # reads .env on every command, so a "docker compose up -d" typed by hand
      # later keeps the deployed image instead of building a "local" one from
      # the working folder in its place. The line is not a secret; no other
      # line of .env is touched.
      - name: Record the deployed tag in .env
        run: |
          $file = Join-Path $env:HOST_DIR '.env'
          $lines = @(Get-Content $file)
          if ($lines -match '^SCORING_SERVICE_TAG=') {
            $lines = $lines | ForEach-Object {
              if ($_ -match '^SCORING_SERVICE_TAG=') { "SCORING_SERVICE_TAG=$env:SCORING_SERVICE_TAG" } else { $_ }
            }
          } else {
            $lines += "SCORING_SERVICE_TAG=$env:SCORING_SERVICE_TAG"
          }
          [System.IO.File]::WriteAllLines($file, $lines, (New-Object System.Text.UTF8Encoding($false)))

      - name: Replace the scoring service, and only it
        run: |
          docker compose --project-directory $env:HOST_DIR -f (Join-Path $env:HOST_DIR 'docker-compose.yml') up -d --no-build --no-deps scoring-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Wait until it is healthy
        run: |
          $compose = @('--project-directory', $env:HOST_DIR, '-f', (Join-Path $env:HOST_DIR 'docker-compose.yml'))
          $id = docker compose @compose ps -q scoring-service
          $deadline = (Get-Date).AddSeconds(180)
          do {
            $state = docker inspect --format '{{.State.Health.Status}}' $id
            if ($state -eq 'healthy') { break }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          if ($state -ne 'healthy') {
            Write-Host "::error::the scoring service is '$state' after 180 s"
            docker compose @compose logs --tail 40 scoring-service
            exit 1
          }

      - name: The service announces the deployed commit
        run: |
          $health = Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 10
          if ($health.revision -ne $env:REVISION) {
            Write-Host "::error::/health announces revision '$($health.revision)', expected '$env:REVISION'"
            exit 1
          }
          Write-Host ("deployed {0} -- model version {1}, state {2}" -f $env:SCORING_SERVICE_TAG, $health.model_version, $health.state)

      # THE JOURNAL OF DEPLOYMENTS, one line each, on this machine: what was
      # deployed, when, from which run, and which model it found in service.
      # The rollback reads it to know what "the previous version" is.
      - name: Record the deployment
        run: |
          $journal = Join-Path $env:HOST_DIR 'runtime\deployments\deployments.csv'
          if (-not (Test-Path $journal)) {
            New-Item -ItemType Directory -Force -Path (Split-Path $journal) | Out-Null
            'deployed_at,tag,revision,image_digest,model_version,run_url' | Set-Content -Path $journal -Encoding ascii
          }
          $health = Invoke-RestMethod -Uri $env:HEALTH_URL -TimeoutSec 10
          $digest = docker inspect --format '{{index .RepoDigests 0}}' ("{0}:{1}" -f $env:IMAGE, $env:SCORING_SERVICE_TAG)
          $run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $line = "{0},{1},{2},{3},{4},{5}" -f (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'), $env:SCORING_SERVICE_TAG, $env:REVISION, $digest, $health.model_version, $run
          Add-Content -Path $journal -Value $line -Encoding ascii
