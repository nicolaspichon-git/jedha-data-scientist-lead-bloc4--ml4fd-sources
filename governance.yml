# Governance policy and parameterised durations.
# Covers: EI12, EC16, EC18
#
# Durations that outlast the demonstration itself live here, and nowhere else in
# the code. No secret belongs in this file: those live in .env.

verdicts:
  # Which of the two delays below is in force. ONE switch, read by S1 and by S3
  # alike: the historical labels and the real-time ones must sit on the same
  # delay, or the blind band before the cut-off differs between training and
  # scoring and the measured recall means nothing.
  #   nominal -- delay_days, the real-world figure
  #   demo    -- demo_delay_seconds, so a verdict falls due during a recording
  mode: demo

  # Delay between a transaction and the moment its verdict becomes known.
  # Sets the width of the blind band before the cut-off.
  delay_days: 30
  demo_delay_seconds: 300        # demonstration value (F13.1, EI12)

  # HOW OFTEN THE DUE VERDICTS ARE WRITTEN, and it has to follow the switch
  # above or the demonstration stalls on arithmetic nobody notices: in demo a
  # verdict falls due 300 s after its transaction, while a DAG running once at
  # 02:00 would write it the next morning. The delay would be short and the
  # labels would still never arrive.
  #
  # 1-59/2 and not */2: dag_monitor runs on the even minutes, so the verdicts
  # are written on the odd ones. Neither waits for the other -- they share no
  # lock -- but a demonstration is read on one screen, and two tasks starting
  # in the same second are harder to follow than two that alternate.
  schedule: "0 2 * * *"
  demo_schedule: "1-59/2 * * * *"

retention:
  # EVERY STORE OF THE PROJECT IS DECLARED HERE, purged or not (S5/Q0). A store
  # missing from this section is one nobody decided about, and the missing one
  # is always the one that holds the most: fd_quarantine kept the raw payload of
  # every REJECTED record with no duration at all, while the accepted ones were
  # purged at 90 days -- the opposite of what limiting retention is for.
  # tests/test_retention.py reads the DDL and refuses a table that appears
  # neither below nor under `kept`.

  # --- stores carrying the cardholder's personal data: purged ---------------
  raw_events_days: 90
  # THE SAME DURATION AS THE RAW ZONE, and config.load() refuses a longer one.
  # fd_quarantine.payload is the raw payload of a rejected record: the same
  # personal data as fd_raw_events.payload. A rejected record has no less right
  # to limited retention than an accepted one, and a rejection is examined in
  # the days that follow, not in the months.
  quarantine_days: 90
  # Airflow's logs carry rejection reasons and stack traces, and a stack trace
  # can quote a line of data. They must not outlive the raw data they may quote,
  # which config.load() also refuses. 30 days is ample to diagnose a failure.
  airflow_logs_days: 30

  # --- stores that are NOT purged, and why. A reason is mandatory. -----------
  kept:
    fd_transactions: >-
      Carries no identifying column: client_key is an HMAC pseudonym and the
      identifying fields were dropped or minimised in L3 (personal_data below).
      Kept for training and for audit.
    fd_ground_truth: >-
      A verdict per txn_id and a date; no personal field. It is the training
      target, and the delay it encodes is the product's own.
    fd_scores: >-
      txn_id, score, threshold, model version: the record of what was decided
      and by which model. No personal field.
    fd_frauds: >-
      txn_id, score and the state of the notification. No personal field; the
      notification channels refuse them (notify.FORBIDDEN_FIELDS).
    fd_pipeline_runs: >-
      Measured rather than assumed (S5/Q4): an identifier, a DAG name, dates,
      a state, counters and the fingerprints of Q1. No personal field, so
      there is nothing to empty -- and its rows must not be deleted either,
      since those fingerprints are all that remains of a purged batch. The
      role that purges holds no DELETE on this table.
    fd_ops_state: >-
      One row per control of the chain, holding its state and the date it
      changed. Operational, no transaction data.
    fd_ops_notifications: >-
      The journal of the operations channel (S6/R9): one row per message sent,
      holding a control name, a state and counts. No transaction data -- the
      payload is checked against FORBIDDEN_FIELDS before it leaves -- and a
      few rows per incident, not per run. Append-only, like fd_purges.
    fd_datasets: >-
      The catalogue of the training sets: recipe digest, paths, counts. No
      personal field; it is the row that ties a model to the data it learned
      from, which is what M8's lineage rests on.
    datasets_directory: >-
      The parquet training sets under runtime/datasets/. MEASURED RATHER THAN ASSUMED
      (S5/Q6): they carry no identifying field -- features and the
      pseudonymised client_key -- so limiting their retention is not what this
      policy is for, and they are the other half of M8's lineage: a registered
      model must stay tied to the set that produced it. About 830 MB a year at
      a weekly cadence, which is a housekeeping question and not a governance
      one. A first version of this file declared "the five latest versions"
      here among the purged stores, and nothing deleted a file: a rule of disk
      hygiene dressed as a retention rule, which is how a declared duration
      comes to be a duration nobody applies. Trimming the directory, if it
      ever matters, is a manual act outside S5.
    fd_purges: >-
      The journal of the purges (S5/Q6): counts, instants and store names, one
      row per store and per execution. No personal field -- and it is the proof
      that the declared durations are APPLIED, which EC18 asks for. Deleting it
      would destroy the evidence that the policy exists in fact; the role that
      purges may insert into it and nothing else.
    fd_promotions: >-
      The journal of the promotion decisions (L3): a model version, the figures
      that decided, and the policy in force at the time. No personal field,
      and nothing to empty. Its rows must not go either: it is the only record
      of why one version is served and another was refused -- a question asked
      long after any retention window, by a jury or by an auditor, and the
      alias in MLflow answers only the first half of it. The role that
      promotes may insert into it and nothing else.
    fd_reports: >-
      The journal of the morning reports: counts and a digest, one row per
      day. The counts are what the audit of S4 re-reads.
    mlflow_registry: >-
      Not purged by S5. Models and their metrics hold no personal data; their
      retention is a registry decision, and a model in service must be
      reproducible, which a purge would break.
    reports_directory: >-
      The Markdown morning reports. They name transactions by identifier and
      amount, never the cardholder. Kept: each is the document its digest in
      fd_reports vouches for.
    fd_retrain_requests: >-
      The retraining requests the monitoring made. Kept, and for the same
      reason as fd_promotions: a request is a decision the system took on its
      own, and "why was this model refitted on the 12th" has to be answerable
      months later. It is also what makes the decision idempotent -- purging it
      would re-arm every standing alert at once. No personal data: a timestamp,
      a run identifier, control names and a sentence.
    fd_scoring_service_calls: >-
      What the scoring service answered, and what it was shown. Kept, like
      fd_scores and fd_promotions, because a decision taken about somebody's
      payment has to be answerable months later -- and answerable means
      re-derivable, which is why the features are stored beside the score
      rather than only the score. Re-running the model against today's history
      would answer a different question: the history has moved.
      THE PSEUDONYM IS THE SAME MINIMISATION fd_transactions carries. The
      caller sends a card number and a home location; the table has no column
      for either, so client_key and a distance are what remains, and a purge
      would remove the record of a decision without removing any identity --
      there is none left to remove.
      A duration was considered and refused on that ground: the thing a
      duration would protect is already absent.
    fd_monitoring: >-
      The monitoring measurements. Kept, and not given a duration: EC45 exists
      to show an evolution over the long run, so a window that purges the
      measurements is a window that erases the thing being asked for. They
      carry no personal data -- a drift score, a recall, a count -- which is
      what makes keeping them cheap. Append-only, like fd_promotions.
    local_cache: >-
      The downloaded historical CSV. It carries personal data but it is the
      SOURCE and downloads again; its place is outside the repository, and it
      is not something S5 destroys.

purge:
  # WHEN THE PURGE RUNS. Weekly, Sunday, at an hour when nothing else does:
  # dag_ingest_verdicts holds 02:00, dag_train Monday 03:00, dag_daily 06:00.
  #
  # WEEKLY AND NOT DAILY, which is the one cadence decision of this project
  # taken for the opposite of the usual reason: a purge at 90 days has no daily
  # urgency, and a destructive task that runs rarely is a task whose failure is
  # NOTICED. A daily purge that breaks on a Tuesday is a line in a log.
  #
  # IT MUST NOT MEET THE VERDICT WRITER. The purge deletes batches of the raw
  # zone; dag_ingest_verdicts READS the raw zone to write the verdicts that
  # fell. At the same instant the purge would take batches out from under it.
  schedule: "0 4 * * 0"

  # THE GUARD AGAINST A TOO-WIDE PURGE (S5/Q2, Q5). A purge that would delete
  # more than this share of a store stops and demands an explicit confirmation:
  # a purge of 90 % of a table may be legitimate, but it is never a routine.
  # Strictly between 0 and 1: at 1 the guard never fires.
  max_share: 0.5

scoring:
  # A FALLBACK, AND NOTHING ELSE. Measured in the code rather than assumed:
  # ml4fd/train.py line 285 overwrites this value with choice.threshold as soon
  # as threshold_policy is set, and it is set (capacity, below). So this number
  # decides a report only in a configuration where no policy is declared.
  #
  # IT IS NOT THE SCORING THRESHOLD. N4 reads the operating threshold from the
  # manifest of the model version it loads, never from here, for a reason that
  # is not a matter of taste: a threshold is only meaningful for the score
  # distribution of the model it was chosen on. The model is retrained every
  # week, so a constant in this file would go stale every week -- and the stale
  # value would be 0.5, which on the measured distribution floods the analysts
  # instead of alerting them.
  #
  # What this file declares is the DECISION: the policy, the capacity, the cost
  # of a false alert. The value is the measurement that follows from them, and
  # it travels with the model, in run.json.
  decision_threshold: 0.5

  # HOW THE OPERATING THRESHOLD IS CHOSEN (M6). 0.5 is the default of a
  # library, never a business decision.
  #
  # cost     : minimise the money lost. The cost of a missed fraud is ITS OWN
  #            AMOUNT, measured per transaction rather than assumed; the cost of
  #            a false alert is the analyst minutes below.
  # capacity : the highest recall that stays within what an analyst can review
  #            in a morning. This is the policy G2 actually constrains.
  #
  # Both are computed and reported at every run; this switch says which one
  # decides. A policy nobody can see is a number nobody can challenge.
  threshold_policy: capacity
  alert_capacity_per_day: 60

  # ---- WHERE THE SCORING IS DONE, since L5 (20/11/2026)
  #
  # THE PIPELINE NO LONGER LOADS THE MODEL. dag_ingest.score_batch used to call
  # score.load() in the scheduler, so the model lived in two processes -- the
  # scheduler's and the service's -- each resolving the champion alias on its
  # own. A service nobody calls is not a decoupling, it is a second path.
  #
  # THE CONTAINER PORT AND NOT THE PUBLISHED ONE, the same rule as
  # realtime.endpoint: inside the compose network a service is reached on the
  # port it listens on, and the 5001 of docker-compose.yml only publishes it to
  # the host's loopback for a browser.
  #
  # Changing this line needs the scheduler recreated, since config.load() runs
  # per task but the compose environment does not.
  endpoint: http://scoring-service:5000

  # HOW LONG A BATCH MAY TAKE. A batch is about five rows -- realtime
  # calls_per_run -- and the model answers in milliseconds, so this budget is
  # for the first call after a promotion, when the service resolves the alias
  # and pulls the model from the registry. Measured on the batch path before
  # the move: 8 ms median once warm.
  #
  # SHORTER THAN realtime.timeout_seconds (35), deliberately: that one waits on
  # a third party over the internet, this one on a container on the same
  # network. A long timeout here would turn "the service is down" into "the DAG
  # hangs", and dag_ingest runs every minute.
  endpoint_timeout_seconds: 20
  cost_false_alert: 4.0          # euros of analyst time for one review

  # The threshold is chosen on the LAST SLICE OF THE TRAINING PERIOD, never on
  # the test set: a threshold tuned on the test set makes the published recall
  # and precision optimistic by construction.
  validation_share: 0.2

  # THE TRUST PLACED IN THE MODEL REGISTRY.
  #
  # MLflow serialises the model with skops, which refuses to load a type it has
  # not been told to trust. ml4fd/registry.py declares three of them, one being
  # the tree structure of HistGradientBoosting -- whose node indices scikit-learn
  # reads without bounds checking, so a crafted model file can crash the process
  # that scores with it.
  #
  # That declaration is sound only while THIS condition holds:
  model_registry_trust: own-pipeline-only
  # meaning: a model is loaded only if this pipeline produced it, in this
  # infrastructure, and write access to the registry is controlled. If models
  # could ever arrive from elsewhere -- a shared registry, an upload, a partner
  # -- the trusted-type list in ml4fd/registry.py has to be revisited BEFORE
  # that happens, not after.

  # THE CALENDAR COLUMNS THE MODEL DOES NOT USE. Decided 2026-11-16, by
  # measurement, and this is the place for it: governance.yml holds decisions,
  # ml4fd/datasets.py holds the catalogue of columns that EXIST.
  #
  # WHY. txn_hour and txn_weekday mean the hour of the PAYMENT in the historical
  # data and the hour of OUR OWN CALL on the stream: the API draws a row at
  # random from 2020 -- measured over the N0 campaign, indices spread over
  # 16,227..553,065 with 29 of 56 gaps positive, a coin flip -- and stamps it
  # with the instant our call returned. So on the stream the two columns are
  # independent of the label BY CONSTRUCTION, while in training they are
  # anything but: the 22:00-03:59 band carries a fraud rate of 1.389 % against
  # 0.079 % elsewhere, a ratio of 17.5.
  #
  # THE MEASUREMENT THAT DECIDED IT. A recipe trained without them was compared
  # with the recipe in service, both read at threshold 0.89, over the SAME 205
  # frauds of the test set, 20 clock permutations:
  #
  #     the amputated recipe catches 21 frauds the other misses,
  #     against 3 in the other direction -- p = 2.8e-4,
  #     +18 frauds in median, significant in 20 draws out of 20,
  #     and never once in favour of the recipe in service.
  #
  # (datasets/fraud_scoring/8813b096e2e4/comparaison-appariee.md)
  #
  # The price is stated rather than hidden: precision falls from 0.595 to 0.529
  # and the volume rises from 31 to 41.6 alerts a day, under the ceiling of 60.
  #
  # IT IS A DEFECT OF THIS TEST BENCH, NOT OF THE DESIGN. "Arrival time = payment
  # time" holds in a real payment application, where the authorisation message
  # arrives seconds after the card is swiped -- N0 measured that latency, median
  # 5.1 s. What this simulator does not do, and cannot do since it ignores the
  # drawn row's own timestamp, is preserve the time-of-day structure. On a real
  # payment stream these two columns should come back, and this comment is where
  # that is recorded.
  #
  # An experiment overrides this list with --conf drop_features, and
  # --conf drop_features=none drops nothing -- which is how the 7-feature recipe
  # stays rebuildable.
  drop_features: [txn_hour, txn_weekday]

  # THE RULE A HUMAN ANALYST WOULD WRITE, and the baseline the model must beat.
  #
  # Measured on this source: 84 % of frauds fall between 22:00 and 03:59, at
  # 0.9-1.9 % against 0.05-0.13 % elsewhere; the median fraudulent amount is
  # 371.94 against 47.29 overall. Two conditions therefore carry most of the
  # signal, and a model that merely matches them has earned nothing.
  #
  # Declared here rather than written into the code: it is a decision about what
  # counts as a worthwhile model, not an implementation detail.
  rule_baseline:
    min_amount: 300
    night_hours: [22, 23, 0, 1, 2, 3]

# WHETHER A NEWLY TRAINED MODEL EVER REACHES PRODUCTION. Lot L3.
promotion:
  # REGISTERING AND PROMOTING ARE TWO DIFFERENT ACTS, and before L3 only the
  # first existed. Every run of S2 registers a version; the scoring path
  # resolved the HIGHEST version number, so a retraining served its own result
  # whether or not it was any good. Automating the retraining on top of that
  # would have automated the serving of an unvetted model -- which is the
  # defect this section closes.
  #
  # The alias the scoring path resolves. Exactly one version carries it.
  champion_alias: champion

  # IS THE CANDIDATE WORSE THAN THE CHAMPION? Decided by the paired test of
  # ml4fd/paired.py, over the SAME held-out frauds, never by two aggregate
  # recalls: the test set holds 205 frauds, and the difference of two recalls
  # measured on them carries +/-0.048 of noise -- enough to make a gain of
  # nine frauds read as 0.9 sigma. That module's header carries the arithmetic.
  #
  # The gate refuses when the CHAMPION catches significantly more frauds than
  # the candidate, at this level. It does NOT require the candidate to be
  # significantly BETTER: a retraining on fresher data that merely holds the
  # line is worth serving, and demanding significance in its favour would
  # freeze the model in place for good.
  significance: 0.05

  # THE OPERATIONAL CEILING. scoring.alert_capacity_per_day above is what an
  # analyst can review in a morning, and it is the constraint G2 actually
  # places on the system. A candidate that exceeds it is refused however good
  # its recall: alerts nobody reads are not detections.
  #
  # OFF FOR THE BOOTSTRAP, 2026-11-20. 
  # The figure the gate compares is train.py's alerts_per_day, 
  # 7200 * flagged / n_test: the THROUGHPUT is the stream's (realtime.schedule
  # x calls_per_run = 7,200 calls a day) and the ALERT RATE is the test
  # split's. Only one of the two halves comes from where the model will serve.
  # The test split runs at a 0.7790 % base rate; the window the producer
  # serves -- fraudTest rows 0 to 99,999, measured 402 frauds in 100,000 --
  # runs at 0.4020 %. So the published 75.9 alerts a day describes May 2020
  # and not the stream. Carrying the test split's false positive rate per
  # legitimate row (185 / 47,253) onto a 0.4020 % window gives about 53 a
  # day, under the ceiling. ABOUT is the whole problem: that is an
  # extrapolation, and a ceiling deserves a measurement. So the first
  # champion is promoted with the check off, the stream is left to run, and
  # monitoring.prediction_drift measures the rate that actually arrives.
  # Then this goes back to true. fd_promotions writes alert_capacity into
  # every row, so a promotion decided with the check off stays visible for
  # good -- which is what makes this defensible instead of merely convenient.
  respect_alert_capacity: true

  # WITH NO CHAMPION YET there is nothing to compare against, and refusing
  # would leave the scoring path with no model to load at all. The first
  # candidate is promoted, and the journal records that it was promoted
  # UNOPPOSED -- which is a different statement from having won.
  promote_first_unopposed: true

  # WHY THE DECISION IS JOURNALLED IN THE DATABASE (fd_promotions) rather than
  # left in a log line. A promotion changes what the system serves; a refusal
  # explains why it did not. Both have to be answerable months later, to a
  # jury or to an auditor, and a log that rotates answers nothing.

# ------------------------------------------------------------------- monitoring
# WHAT C6 ADDS TO WHAT S3 ALREADY WATCHED. The ops section below watches the
# CHAIN: is it running, is it rejecting, is it fresh. This section watches the
# MODEL: are the transactions still shaped like the ones it was fitted on, is
# it still flagging at the rate it was tuned for, and is it still catching what
# the specification requires. A chain in perfect health can serve a model that
# has quietly stopped working, and nothing in S3 would say so.
monitoring:
  # THE SWITCH, the same one as verdicts.mode and for the same reason: a loop
  # whose windows are measured in days is a loop nobody can show. nominal is
  # the real configuration; demo shortens every window below so the whole
  # cycle -- drift, alert, retraining, gate, promotion -- fits in a recording.
  #   nominal -- the windows a production stream would use
  #   demo    -- the windows of the demonstration
  mode: demo

  # HOW OFTEN THE MODEL IS WATCHED. Hourly at 17 past in nominal: the drift
  # window is 24 hours, so measuring more often would re-read the same window
  # and fill fd_monitoring with rows that say the same thing. 17 rather than 0
  # because a scheduler with every cadence on the hour starts everything at
  # once; the offset costs nothing and spreads the load.
  #
  # EVERY TWO MINUTES IN DEMO, and that is what makes the five-minute criterion
  # reachable at all: a drift injected at T is measured by T+2, the retraining
  # is asked for in the same run, and the gate decides when the candidate is
  # fitted. An hourly monitor would make the loop correct and unshowable.
  schedule: "17 * * * *"
  demo_schedule: "*/2 * * * *"

  # THE TOOL, named because EC38 requires a named one. The figure it computes
  # and the version that computed it are written into every row of
  # fd_monitoring: a drift statistic is comparable only with another computed
  # the same way, and the per-column test Evidently selects depends on the
  # column type and on the sample size, by its own rules and not by ours.
  tool: evidently

  # WHAT THE CURRENT WINDOW IS COMPARED AGAINST. The training split of the
  # model in service -- its own train.parquet, found through the manifest of
  # the recipe its registered version came from. Not a fixed file: when the
  # gate promotes a new model, the reference must move with it, or the drift
  # measured is the drift away from a model nobody is running.
  reference: training_split

  # ---- the inputs moving away from the reference (EC39)
  input_drift:
    # 24 hours at the announced rate is 7,200 transactions: enough for a
    # distribution test to mean something. An hour would be 300 rows, where
    # the test's own sampling noise is larger than the drift worth acting on.
    window_minutes: 1440
    demo_window_minutes: 15

    # AND A FLOOR ON THE SAMPLE, symmetric with performance.min_labelled_frauds
    # below. Added 2026-11-20, because the measurement ran on ANY non-empty
    # window: three rows produced a verdict carrying the same authority as
    # seven thousand. performance refuses to conclude under 30 labelled frauds;
    # drift concluded on anything at all. One of the two was wrong, and it was
    # not performance.
    #
    # 500 nominal, against the 7,200 the window should hold: a floor that only
    # bites when under 7 % of the expected volume arrived -- which is itself
    # worth knowing, and is now reported as unmeasurable rather than as drift.
    #
    # 50 in demo, against the ~75 the fifteen-minute window holds, and the
    # lower floor is justified by the SIZE of the injected effect rather than
    # by convenience: the drift switch multiplies the amount up to the
    # validation bound, which shows on tens of rows where a seasonal shift of a
    # few percent would not. A thin window still carries its n_rows into
    # fd_monitoring, so a reader always sees what a verdict rests on.
    min_rows: 500
    demo_min_rows: 50

    # THE SHARE OF COLUMNS THAT MUST DRIFT BEFORE THIS IS AN ALERT.
    #
    # 0.40 UNTIL 2026-11-20: five features were measured, so 0.40 was two of
    # them, on the argument that one column drifting is ordinary -- a seasonal
    # amount, a category gaining share -- while two is a change of shape.
    #
    # WHY IT MOVED. not_comparable below removes the two history features, so
    # three columns are now measured and the same intent -- two columns -- is
    # 0.667, not 0.40. But the real reason is the one the per-column figures
    # exposed: of those three, TWO drift permanently and for a reason that has
    # nothing to do with the model ageing. The producer replays a 100,000-row
    # slice of fraudTest spanning 2020-06-21 to 2020-07-26; the corpus is
    # fraudTrain over about eighteen months. A one-month slice of another file
    # has its own merchant mix and its own geography, so category (PSI 0.230)
    # and f_home_distance_km (0.557) sit outside their limits at rest, with no
    # injection and no drift of the stream itself.
    #
    # That offset is REAL and the control is right to see it -- the model is
    # serving a population it was not trained on, and the retraining the loop
    # asked for at 10:52 on 2026-11-20 was the correct answer to it. What the
    # offset cannot be is a THRESHOLD: 2 of 3 is the permanent state, so a
    # limit of 0.40 reports alert for ever, can never fall back to ok, and
    # therefore can never re-arm. An alert that cannot re-arm is not a trigger;
    # it is a lamp that was left on, and the loop fires exactly once.
    #
    # 0.70 IS ABOVE THE MEASURED OFFSET AND BELOW EVERYTHING ELSE. At rest
    # 2/3 = 0.667 reads ok; one more comparable column moving gives 3/3 = 1.0
    # and reads alert. The control now answers the question worth asking --
    # has the stream moved beyond the offset we have measured and written down
    # -- instead of restating the offset at every run.
    #
    # WHAT PUTS IT BACK TO 0.40. A producer that replays the corpus's own
    # distribution, or a champion trained on a corpus that includes enough of
    # the stream to cover it (datasets.include_stream delivers 7,200 rows a day
    # against 1,164,585, so 0.6 % a day -- not enough yet). When the offset is
    # gone, this line is the first that should go back.
    #
    # Per-column scores are recorded whatever the verdict, so the column that
    # moved first stays readable afterwards, and the detail of
    # drifted_columns_share carries "n of m columns drifted" -- which is how a
    # reader of EC45's series knows that m changed the day this list did.
    max_drifted_share: 0.70

    # THE STATISTIC IS PINNED, and this is the one setting here that exists for
    # EC45 rather than for EC39. Left to itself Evidently picks the per-column
    # test from the column type AND the sample size -- K-S below about a
    # thousand rows, a distance above it. The demonstration window holds ~75
    # transactions and the nominal window 7,200, so the two modes would be
    # measured by two different statistics, and the long series EC45 asks for
    # would change units partway through without saying so.
    #
    # psi, because it reads the same way for a numeric and a categorical
    # column, which keeps one number per column whatever the recipe holds.
    # Its per-column threshold is left to the tool and recorded from what the
    # tool reports, so the limit in each row is Evidently's and not a number
    # invented here.
    method: psi

    # WHICH COLUMNS THE DRIFT IS MEASURED ON, by naming the ones it is NOT.
    # Added 2026-11-20 after reading the per-column figures of a monitor that
    # had been in alert since 09:34:34 without a single injection behind it:
    #   f_tx_count          6.857   f_home_distance_km 0.557   category 0.230
    #   amt                 0.073   f_avg_amount       0.027   (limit 0.100)
    # The two columns the amount injection moves were UNDER the limit and the
    # alert rested entirely on columns nothing had touched.
    #
    # THE CRITERION IS THE DEFINITION OF THE FEATURE, NOT ITS FIGURE, and the
    # list below is the proof of it: f_avg_amount sits at 0.027, well inside
    # its limit, and is excluded all the same. A list chosen by the figures
    # would be a list that silences whatever is currently inconvenient.
    #
    # WHAT THE DEFINITION SAYS. sql/functions/fd_client_features.sql, ruling 3:
    # "population: the whole fd_transactions table, all batches together",
    # with a strict bound txn_ts < p_ts. A streamed transaction carries a 2026
    # timestamp, so EVERY historical row of its cardholder precedes it and
    # counts: the feature arrives at roughly the client's full history, about
    # 1,400 transactions for 1,296,675 rows over 924 cardholders. A row of the
    # training corpus carries the count that had accumulated by ITS OWN date --
    # near zero at the start of the corpus, near the full count at the end.
    # The two distributions describe the loading order of the table, not the
    # behaviour of the cardholder, and no retraining can make them agree.
    #
    # f_avg_amount comes from the same function and the same population, so it
    # carries the same defect; a mean over 1,400 values merely hides it where a
    # count cannot. Excluding one and keeping the other would mean the rule is
    # the PSI and not the population.
    #
    # WHAT IS NOT EXCLUDED, and deliberately. amt, category and
    # f_home_distance_km are computed per row -- transform.home_distance_km
    # reads only that row's own coordinates -- so a corpus row and a stream row
    # are computed identically and their distributions are comparable. category
    # and f_home_distance_km do drift, and that drift is real: the producer
    # replays a 100,000-row slice of fraudTest spanning 2020-06-21 to
    # 2020-07-26 against a corpus spanning a year and a half. A narrow slice of
    # another file IS a different population, and a monitor that says so is
    # right. Silencing them would turn this control into a drift detector that
    # can only ever see what we inject ourselves.
    #
    # EC45 READS A SERIES, so the count is published with every verdict:
    # drifted_columns_share carries "n of m columns drifted" in its detail, and
    # m changes the day this list changes. A share of 0.60 over five columns
    # and one over three do not mean the same thing, and the row says which.
    not_comparable: [f_tx_count, f_avg_amount]

  # ---- the predictions moving (EC39)
  prediction_drift:
    # MEASURED ON THE FLAG RATE AND NOT ONLY ON THE SCORES, because the flag
    # rate is the thing with an operational consequence: it is what fills the
    # analyst's queue, under the capacity of 60 a day. The champion was
    # measured at 41.6 alerts a day on its test window.
    #
    # A ratio and not an absolute: the reference moves with every promotion,
    # and a number written here would go stale at the first retraining. Twice
    # the rate the model was published at means the score distribution has
    # moved under a threshold that was chosen for the old one.
    max_alert_rate_ratio: 2.0

  # ---- the performance against the specification (EC40)
  performance:
    # THE CRITERION OF THE SPECIFICATION, stated here so that it is measurable
    # in production and not only at training time. The champion published
    # 0.751 recall on its test split; 0.60 is the floor below which the service
    # is not doing its job. The gap between the two is deliberate: it is the
    # room a model has to age before anybody is woken up.
    min_recall: 0.60

    # AND THE DENOMINATOR THAT MAKES THAT FLOOR READABLE. At a base rate of
    # 0.414 % the stream yields about 30 frauds a day, and a recall over 30
    # frauds carries a standard error of 0.079 -- so a single day's figure
    # swings +/-0.16 at two sigma, which is wider than the gap being watched.
    # Seven days is about 210 frauds and a standard error of 0.030. Below this
    # count the measurement is recorded as 'unmeasurable' rather than compared:
    # a floor crossed by sampling noise is a false alarm that costs a
    # retraining.
    window_days: 7
    demo_window_minutes: 15
    min_labelled_frauds: 30

  # ---- the quality of what the stream delivers (EC42)
  data_quality:
    # NOT MEASURED AGAIN HERE. Schema, missing values, out-of-range values and
    # freshness are already decided and already measured: validation rejects to
    # fd_quarantine with a reason, and ops below watches freshness and the
    # rejection rate. Re-measuring them would create a second set of figures
    # that could disagree with the first.
    #
    # What this lot adds is that those figures are COPIED into fd_monitoring,
    # so they sit on the same timeline as the drift and the performance. EC45
    # asks to see an evolution; three stores with three retentions cannot be
    # read together.
    from_existing_controls: true

  # ---- the trigger (EC33)
  trigger:
    # WHICH ALERTS CAUSE A RETRAINING, and the list is deliberately short.
    # Input drift and a performance floor crossed are the two conditions a
    # retraining can actually answer. Prediction drift usually calls for a
    # threshold to be rechosen rather than a model to be refitted, and a data
    # quality alert calls for the stream to be fixed -- retraining on a broken
    # stream would learn the breakage.
    # retrain_on and not 'on': in YAML 1.1, which PyYAML implements, the bare
    # word on is a BOOLEAN. 'on:' parsed as the key True, and the list was
    # reachable only as settings[True] -- found by the check below two minutes
    # after it was written, 2026-11-19. off, yes, no and y are the same trap.
    retrain_on: [input_drift, performance]

    # THE SCHEDULE IS NOT REPLACED BY THE TRIGGER. dag_train still runs every
    # Monday: a periodic retraining is what keeps a model current when nothing
    # has gone wrong enough to alert.
    periodic: weekly

    # AND NO MORE THAN ONE RETRAINING PER COOLDOWN. A drift that persists
    # raises the same alert every window, and without this a single afternoon
    # of drift would queue forty trainings on one worker.
    cooldown_minutes: 360
    demo_cooldown_minutes: 2

    # WHY THE TRIGGER IS ALLOWED TO BE WRONG. It may fire on a drift that
    # turns out harmless; the cost is a training nobody needed. It cannot put
    # a bad model in service, because registering is not promoting: the gate
    # of L3 judges the candidate against the champion and refuses it. The
    # trigger is therefore tuned to miss little, not to be right -- the
    # expensive mistake is downstream, and it is already guarded.

  # ---- the channel (EC44)
  # A THIRD AUDIENCE, and a third destination. The analyst is told about a
  # transaction; the pipeline owner is told about the chain; the owner of the
  # MODEL is told that what is in service no longer matches the world it was
  # fitted to. Routing this into either of the other two would bury it: the
  # analyst's queue is capped at 60 a day and a drift message would spend one
  # of those, and the ops channel is read when the chain is down.
  channel: file
  file: runtime/channels/monitoring/monitoring.jsonl

  # THE DESIGNATED RECIPIENT, which EC44 asks for by name. A role and never a
  # person: the holder changes, the responsibility does not.
  recipient: model owner (data scientist on duty)

  # ONLY ON A CHANGE OF STATE, as ops does. A drift that lasts three days is
  # one piece of news, not 4,320 messages. ml4fd/health.py already holds that
  # logic and fd_ops_state already holds the state, so the controls of this
  # section go through the same path.
  notify_on_transition_only: true

# HOW A FLAGGED TRANSACTION REACHES SOMEBODY. Lot N5, decided 2026-11-16.
notifications:
  # The channel is a function taking (payload, settings), declared in
  # ml4fd/notify.py. Two are realised:
  #
  #   log  : a structured line in the service journal
  #   file : one JSON line appended to the path below
  #
  # Neither can fail for a reason outside this stack, which is what makes the
  # demonstration reproducible. A real channel -- a webhook, a mail service --
  # plugs into the same three-line interface without touching the lifecycle.
  # None is claimed here: there is no mail service in the stack, and whether
  # SMTP would be reachable from the container has not been measured.
  #
  # An unknown name is REFUSED rather than defaulted: a typo would otherwise
  # send every alert to whichever channel happened to be first.
  channel: file

  # Under runtime/, with everything this stack PRODUCES -- the documents, the
  # datasets, the two channels -- and no longer under ws/, which carries the
  # plans and the measurements. One directory to mount, back up or wipe.
  # The parent directory is created rather than assumed: 28 real observations
  # were once lost to a directory that was not mounted.
  file: runtime/channels/frauds/frauds.jsonl

  # DELIVERY SEMANTICS: send, then record. At least once.
  #
  # With an external channel the send and its recording cannot be made atomic,
  # so the choice is which failure to prefer. A crash between them re-sends on
  # the next run, and txn_id travels as an idempotency key so a receiver can
  # discard the duplicate. The reverse order would lose a fraud notification in
  # silence while the table claimed it had gone out. A fraud notified twice is
  # better than a fraud never notified.
  #
  # Declared rather than left in the code because it is a business decision
  # about which risk is acceptable, not an implementation detail.
  delivery: at-least-once

  # scoring.alert_capacity_per_day is ENFORCED here, not merely used to pick a
  # threshold. Beyond it, in a ROLLING 24 hours, alerts are still RAISED and
  # notification stops with a loud line: a bad retrain becomes visible instead
  # of drowning the analyst. A calendar day would let 60 go out at 23:50 and 60
  # more at 00:10, so the window rolls.
  enforce_capacity: true

# ------------------------------------------------------------------ operations
# THE CHANNEL OF THE PIPELINE OWNER, which diagram 3.3 specifies as "(3c)
# dag_ingest : check" -> "ops channel". The development plan of S3 listed five
# tasks for N7 and none of them was that stage, so it was built in N9 after the
# omission was found by reading the diagram against the code.
#
# A DIFFERENT AUDIENCE FROM notifications ABOVE, and that is the whole reason
# this section exists rather than reusing it. The analyst is told about a
# flagged TRANSACTION, under a capacity of 60 a day. The pipeline owner is told
# about a state of the CHAIN. Routing one into the other would poison exactly
# the queue the capacity policy exists to protect: an analyst who receives
# pipeline messages stops reading alerts. ml4fd/config.py REFUSES two equal
# destinations.
ops:
  # Same interface as a notification channel -- a function taking
  # (payload, settings) -- declared in ml4fd/health.py. An unknown name is
  # refused rather than defaulted.
  channel: file

  # A DISTINCT FILE, not a section of the analyst's, and a distinct directory:
  # runtime/channels/ holds one subdirectory per channel -- named for what they
  # ARE, destinations, and not for what either of them carries -- so a reader
  # of one is never handed the other. config.load() still refuses them equal.
  file: runtime/channels/ops/ops.jsonl

  # THE WINDOW THE SHARES ARE MEASURED OVER. One hour is 60 runs at this
  # cadence: enough for a share to mean something, short enough that an
  # incident shows inside the hour. A day's window would dilute a fresh
  # incident among 1,440 healthy runs and the shares would barely move.
  window_minutes: 60

  # FRESHNESS: minutes allowed since the last SUCCESSFUL run.
  #
  # Ten, and the number comes from the measurements. The cadence is one run a
  # minute and the worst realistic run is about 47 s, so ten consecutive lost
  # minutes is not a statistical accident: N0 measured about 5 % of calls
  # failing, and a run makes five, so an entirely empty run needs all five to
  # fail. Ten empty minutes in a row therefore means the API, the network or
  # the chain is down -- not bad luck. It also bounds what is lost before
  # anyone is told: ten minutes is about 50 transactions never seen.
  freshness_minutes: 10

  # EMPTY RUNS: the share of ended runs that stored nothing.
  #
  # An empty run is one with n_read null or zero, which covers two different
  # events on purpose -- the API returning nothing for all five calls, and the
  # chain stopping before close_run recorded the counters. Both mean the same
  # thing to an operator: that minute stored nothing. The expected share is
  # near zero by the arithmetic above, so 10 % -- six runs in the hour -- is a
  # wide margin that still catches an outage within the hour.
  max_empty_run_share: 0.10

  # REJECTION RATE: the share of read lines sent to quarantine.
  #
  # Five per cent, and the floor is measured rather than chosen: N0 saw one
  # call in 57 (1.75 %) with an 818 s gap -- our own process suspended, not the
  # server -- and such a reading goes to quarantine on the clock tolerance. So
  # the normal rate is NOT zero, and a threshold at zero would hold this
  # control in permanent alert. Above five per cent the stream has changed
  # shape -- a renamed field, a clock drifting -- and the transactions
  # concerned are not scored at all, which is the silent failure this control
  # exists to make loud.
  max_rejection_rate: 0.05

# --------------------------------------------------------------------- reports
# S4 produces a DATED DOCUMENT each morning, not a page to refresh. Everything
# here is read by sql/reports/*.sql and by ml4fd/report.py.
report:
  # THE ZONE THE CALENDAR DAY IS COUNTED IN, and it is not a detail. The hourly
  # breakdown of section 1 is read against the night fraud peak measured in M5
  # -- 84 per cent of the frauds between 22h and 03h -- and a report whose
  # hours were UTC would place that peak two hours off in summer and one in
  # winter. The window bounds themselves are passed by the DAG as absolute
  # instants, so this zone only names the hour buckets and the calendar day.
  #
  # Declared here rather than left in a DAG argument: a value that lives only
  # in code is a decision nobody can find.
  timezone: Europe/Paris

  # WHERE THE DOCUMENTS LIVE, under the project like every other declared path.
  # One file per covered day, named by that day:
  # runtime/reports/2026-11-16.md.
  #
  # Declared because something outside this stack will read it. The short-term
  # intention is a Streamlit server in docker-compose presenting the daily
  # report, and that container will need THIS directory mounted. A path chosen
  # in code would be found by whoever mounts the wrong one -- which this project
  # has already paid for twice, 28 real observations and a whole dataset lost to
  # a directory that was not mounted.
  root: runtime/reports

  # WHEN THE MORNING REPORT IS PRODUCED, and the hour answers a dependency
  # before a preference: section 3 reads the verdicts that fell, written at
  # 02:00 by dag_ingest_verdicts, so the report must pass after. And a report
  # produced at 08:00 would keep the analyst who arrives at 08:00 waiting.
  #
  # BEWARE WHAT THIS HOUR MEANS FOR THE WINDOW. Airflow's interval for this
  # cadence runs from 06:00 to 06:00, which is NOT a calendar day. The covered
  # day is DERIVED from data_interval_start -- see airflow/dags/dag_daily.py --
  # and the report always covers midnight to midnight in the zone above.
  schedule: "0 6 * * *"

labels:
  # The last labelled fraud of the training corpus: a cut-off beyond this point
  # would train a model on rows carrying is_fraud = 0 because nobody labelled
  # them, which are false negatives and not legitimate transactions.
  #
  # Measured on fraudTrain.csv by tools/profile_corpus.py, 2026-11-19:
  #   1,296,675 transactions, 7,506 frauds, base rate 0.5789 %
  #   first payment     2019-01-01 00:00:18
  #   last payment      2020-06-21 12:13:37
  #   last labelled     2020-06-21 03:59:46
  #
  # NO UNLABELLED TAIL HERE, unlike the corpus this project used until the
  # swap. fraudTest.csv stopped being labelled on 2020-12-22 while running to
  # 12-31 -- nine days and 38,147 rows of silent false negatives, which is why
  # this setting exists at all. fraudTrain.csv is labelled to its last hours,
  # so the horizon sits eight hours from the end rather than nine days.
  horizon: 2020-06-21T03:59:46Z

  # A window holding no positive stops the training DAG, exactly as a window
  # holding no run does (EC14 applied to labels).
  min_positives: 1

datasets:
  # Relative, and resolved against the PROJECT by config.load() -- never
  # against the process's working directory. An Airflow task runs from
  # /opt/airflow, where this would land outside the mounted volume.
  root: runtime/datasets
  family: fraud_scoring
  # v2 stores txn_ts alongside the features: M6 chooses the threshold on a
  # temporal validation slice of the TRAINING period, and a slice cannot be cut
  # without the time. Bumping this changes the recipe digest, which is the whole
  # point -- a dataset of the old shape is not reused and silently found short.
  schema_version: v2
  # Deterministic and explicit, never random_state: a library version change
  # would otherwise make the split irreproducible and the audit worthless.
  #
  # THE RULE BEHIND THESE TWO DATES, which is what survives a change of
  # corpus: the test side is the last FULL calendar month before the month
  # that holds the horizon, and the train side is everything before it. The
  # horizon's own month is left out because it is partial, and a partial month
  # carries the generator's own edge rather than the month's behaviour.
  #
  # Applied to fraudTrain.csv, whose horizon falls on 2020-06-21: the test side
  # is May 2020 -- 74,343 transactions and 527 frauds -- and the train side is
  # 2019-01-01 to 2020-04-30. The former corpus gave 205 test frauds; 527 is
  # two and a half times the paired test's material, and the noise on a
  # difference of two recalls falls from +/-0.048 to about +/-0.030.
  split_rule: "temporal:train<=2020-04-30,test<=2020-05-31"

  # WHETHER THE STREAM IS A TRAINING SOURCE, decided 2026-11-20 and the answer
  # to a question a jury will ask: on what does the retraining retrain?
  #
  # Until today, on nothing new. The query bounds the rows by
  # t.txn_ts < test_end, which is 2020-05-31, while a streamed transaction
  # carries current_time -- so not one of them had ever entered a training set.
  # The cut-off was clamped to labels.horizon as well, so the recipe digest
  # never changed and build_or_reuse handed back the same Parquet files: the
  # loop refitted on identical data and produced a model identical to the one
  # it replaced.
  #
  # TWO SOURCES, TWO LABELLING REGIMES, which is the whole reason this is a
  # flag and not a line deleted from the query. The historical corpus is
  # trustworthy only up to labels.horizon -- past it its rows carry
  # is_fraud = 0 because nobody labelled them, not because they are not fraud.
  # The stream is labelled as it goes, by dag_ingest_verdicts, so its verdicts
  # are real up to the cut-off. The query now bounds each source by its own
  # regime, telling them apart by fd_raw_events.source and never by a date.
  #
  # AND THE STREAM ROWS GO TO train, NEVER TO test. The gate of L3 compares a
  # candidate to the champion on one test set; a test set that moved with every
  # retraining would make the published figures incomparable from one version
  # to the next, which is what the whole promotion journal exists to prevent.
  #
  # false RESTORES TODAY'S BEHAVIOUR AT THE BIT. Recipe.canonical() omits this
  # key when it is false, so the digest of a stream-free recipe is byte for
  # byte the one it was before this lot -- the champion's dataset stays
  # findable and no file is rewritten. That is the escape hatch, and it is
  # tested.
  #
  # WHAT IT DOES NOT FIX, said here rather than discovered at the oral: the
  # stream delivers 7,200 rows a day against 1,164,585 training rows, so 0.6 %
  # a day. Admitting it makes the retraining mechanically fresh; it does not
  # make the model move. Moving it needs a windowing or weighting policy, and
  # the share is recorded in each dataset's manifest so the claim always comes
  # with its denominator.
  include_stream: true

realtime:
  # Measured in N0 (ws/fraud-project--n0-mesure-api--20261116-0826.md), on a
  # campaign of 60 calls run ALONE -- three overlapping campaigns had reported
  # 13 % failures that were our own load.
  # THE ADDRESS OF THE STREAM, and the one line that had to change when a third
  # party went down. On 2026-11-19 the Hugging Face Space stopped answering: it
  # reported itself running while its application returned an error. S3 reads
  # an endpoint and not a code path, so standing up a local producer and
  # pointing this line at it was the whole repair -- no module of the ingestion
  # knows, or needs to know, which one is serving.
  #
  # ONE PRODUCER, AND IT IS OURS. producer/ is derived from the exercise's own
  # application -- the FastAPI route, the slowapi limiter, the df.sample() and
  # the df.to_json(orient="split") that produces the response -- with its three
  # defects repaired: it re-read 150 MB from a public mirror on every call, it
  # sampled the whole corpus so no drift could ever show, and its "/" route
  # answered 500. vendor/realtime-transactions-producer holds the original,
  # untouched, as the reference the derivation is read against.
  #
  # The alternative, for the record and for a line nobody has to guess at
  # later:
  #
  #   https://sdacelo-real-time-fraud-detection.hf.space/current-transactions
  #       The hosted Space. Stopped answering on 2026-11-19: it reported itself
  #       running while its application returned an error. Still the same
  #       contract, so this line is all it takes to go back to it.
  #
  # Changing this line needs the scheduler recreated, since config.load() runs
  # per task but the compose environment does not.
  # The CONTAINER port and not the published one: inside the compose network
  # a service is reached on the port it listens on, and the 8801 in
  # docker-compose.yml only publishes it to the host's loopback for a browser.
  endpoint: http://producer:4000/current-transactions

  # WHAT THE STAND-IN DOES NOT REPRODUCE, said rather than discovered later.
  # N0 measured about 5 % of calls to the real API failing -- 2 of 60 with a
  # 502, 1 with a 429 -- and ops.freshness_minutes and ops.max_empty_run_share
  # were calibrated on that. The local server answers every call, so those two
  # controls sit permanently green while it is in service. Faking failures
  # would be inventing data; this comment is the honest alternative.

  # A 502 costs 25 s and is the expensive failure; a 429 costs 0.23 s. A timeout
  # under 26 s would cut off calls that were about to succeed.
  timeout_seconds: 35

  # HOW OFTEN N7's DAG RUNS. Decided 2026-11-16.
  #
  # The plan framed this as a latency question. It is not. N0 established there
  # is no journal to consume: one call returns ONE transaction, the present
  # instant, with no queue behind it. So the cadence does not set the detection
  # delay -- it sets THE SHARE OF THE STREAM THAT IS SEEN, and what is not seen
  # is never scored.
  #
  # That makes the cadence a constraint of the calibration, not a comfort
  # setting: ml4fd/threshold.py works at API_TXN_PER_DAY = 7200, five a minute,
  # and both the threshold 0.93 and the capacity of 60 alerts/day rest on it. At
  # one run a minute of five calls we observe 7,200 a day and the figures mean
  # what they say. At one run every five minutes we would observe 1,152 -- 16 %
  # of the traffic -- and the capacity would be wrong by a factor of six while
  # every number still looked plausible.
  schedule: "* * * * *"
  calls_per_run: 5

  # Five, not four. Four was chosen in N1 for margin under the limiter, which
  # fired at 13 calls/minute and never below -- and five keeps a factor of 2.6
  # there. What moved the number is coverage, measured against the announced
  # rate above, and not the limiter.
  #
  # The time budget, from N0: median latency 5.4 s, so five sequential calls take
  # about 27 s of the minute. One 502 costs 25 s, which brings the worst
  # realistic run to roughly 47 s -- still inside the minute. TWO 502s would
  # overrun it, so N7 sets max_active_runs=1: a slow run must delay the next,
  # never run beside it, or two collectors would write the same batch.
  #
  # THAT BUDGET DESCRIBED A SERVICE THAT NO LONGER SERVES. Measured against the
  # local producer, 18 calls on 2026-11-20
  # (runtime/observations/n0-api-measure--20261120-0013.md): median latency
  # 8 ms, minimum 6, maximum 17. Five sequential calls now take about 40 ms of
  # the minute instead of 27 s, and the producer simulates no 502 at all, so
  # the worst realistic run is no longer 47 s. The time budget is therefore no
  # longer what justifies max_active_runs=1. The reason that remains is the one
  # that never depended on latency: two collectors running side by side would
  # write the same batch. Nothing to change here -- but a reader must not take
  # the 5.4 s above for a figure of the system as it stands.
  spacing_seconds: 0

  # current_time IS the txn_ts of a real-time transaction. One call in 57 showed
  # a gap of +818 s -- our own process suspended, not the server -- and the
  # remedy is the same either way: beyond this tolerance the reading goes to
  # quarantine rather than carrying a timestamp into the ordering that L4 proved.
  clock_tolerance_seconds: 120

validation:
  # THE BOUND MUST HOLD OVER BOTH CORPORA, because one is trained on and the
  # other is served as the stream: a bound that rejected the stream's largest
  # amounts would quarantine them, and the monitoring would read a data
  # quality alert where the truth was a setting too tight.
  #
  # Measured 2026-11-19: fraudTrain.csv 28,948.90 (2019-12-01), fraudTest.csv
  # 22,768.11 (2020-12-27). The bound leaves room above both without becoming
  # meaningless. Not a magic number in the code (EC20).
  max_amount: 50000
  # A gap shared by more than this share of rows is a SOURCE defect, documented
  # and ruled on once -- not a per-record rejection. See checks.profile_gap.
  systematic_share: 0.99

sources:
  # THE TWO HALVES OF ONE STREAM, AND THEY ARE CONTIGUOUS. Measured 2026-11-19:
  # fraudTrain.csv ends at 2020-06-21 12:13:37 and fraudTest.csv begins at
  # 2020-06-21 12:14:25 -- forty-eight seconds apart. The Kaggle dataset is a
  # single generated stream cut in two, not two samples.
  #
  # So training on the first and serving the second is not a convenience: the
  # stream is literally the FUTURE of the training data, continuous, same
  # generator, no overlap and no gap. That is the most faithful production
  # simulation this dataset can support, and it is the opposite of what the
  # original exercise did -- the real API sampled fraudTest.csv, the file the
  # project trained on, so most transactions it served were rows the model had
  # already been fitted on.
  #
  # AND IT GIVES C6 SOMETHING REAL TO FIND. The base rate falls from 0.5789 %
  # over the training corpus to 0.3860 % over the stream, and within the stream
  # from 0.4425 % in June to 0.1849 % in December. The fraud rate more than
  # halves across the served period. That drift is in the data rather than
  # injected, which means the monitoring has a true positive to show before
  # anything is forced.
  #
  # A PRIVATE BUCKET holds both files, so these two values are OBJECT KEYS and
  # not URLs. The bucket is ML4FD_CORPUS_BUCKET in .env, with the credentials
  # beside it: its name carries an AWS account number, and a versioned file is
  # the wrong place for one. ml4fd/fetch.py resolves a key against that bucket
  # with boto3, caches the file under .local_cache/ with its sha256, and takes
  # the cache on every later run -- so the credentials are needed once.
  #
  # The last segment of a key names the cached file, which is why the keys end
  # in the file names, and why a bare file name still works for a file placed
  # by hand.
  realtime_api: https://huggingface.co/spaces/sdacelo/real-time-fraud-detection
  historical_csv: kaggle-datasets/fraudTrain.csv
  replay_csv:     kaggle-datasets/fraudTest.csv

  # The producer in service, and the original it derives from -- both named,
  # because which one served on a given day is a fact the dossier has to be
  # able to state.
  producer: producer/app.py
  producer_origin: vendor/realtime-transactions-producer/app.py

  # WHAT THE STAND-IN REPLAYS, and it is NOT historical_csv above. That file is
  # what the model was fitted on -- train<=2020-10-31, tested on November -- so
  # replaying it would serve the model transactions it has already seen: the
  # measured performance would be optimistic by construction, and the drift
  # against the training reference would be zero because the two samples would
  # be one sample.
  #
  # fraudTrain.csv is the other half of the same Kaggle dataset: same
  # generator, same schema, 2019-01-01 to 2020-06-20, disjoint rows. Every
  # transaction served is one the model has never met, which is the whole
  # premise of measuring anything in production.
  #
  # Its base rate differs -- about 0.58 % against the 0.414 % of the usable
  # historical horizon -- and that difference is real rather than a defect:
  # fd_monitoring records base_rate beside every performance figure precisely
  # so a recall is never read against the wrong one.
  #
  # The stand-in serves the END of the file. June 2020 sits closest in time to
  # the training period, so it should be the quietest baseline the file can
  # offer; starting in January 2019 would risk the drift controls sitting in
  # alert before anything was injected.
  replay_csv: kaggle-datasets/fraudTest.csv

  # WHERE THE DRIFT IS SWITCHED ON. A file, read by the stand-in on every
  # request, because the switch has to outlast one run: a DAG conf lasts a
  # single execution, and an environment variable needs the container
  # recreated at each flip. Absent file means no drift.
  #
  # A drift has to enter the pipeline AS DATA or it is not a drift. The
  # stand-in shifts the amount of each transaction it serves, before the raw
  # zone, so the change travels through validation, the features, the scoring
  # and the monitoring exactly as a real change of the stream would -- the same
  # choice --corrupt makes for EC25. The shift is capped just under
  # validation.max_amount: above it the transactions would be quarantined, and
  # the demonstration would show a data_quality alert where it meant to show an
  # input_drift one.
  #
  # UNDER runtime/producer/ AND NOT AT THE ROOT OF runtime/. runtime/ holds one
  # directory per producer of artefacts -- datasets/, observations/, channels/,
  # reports/ -- and the switch is the stand-in's own state, so it belongs in a
  # directory of its own rather than loose beside them.
  #
  # IT MUST STAY UNDER runtime/, AND THAT IS NOT TIDINESS. The writer runs in
  # the scheduler container and the reader in the producer container; runtime/
  # is the only path the first mounts read-write and the second mounts
  # read-only. A switch declared anywhere else would be written where nobody
  # reads it, and drift_factor() answers 1.0 to a file it cannot find -- so the
  # demonstration would inject nothing and say nothing. tests/test_drift.py
  # holds that invariant.
  drift_switch: runtime/producer/drift.json

personal_data:
  # Fields that identify a person. None of them reaches the exploited layer.
  identifying_fields:
    [first, last, street, city, state, zip, lat, long, job, dob, cc_num]

  # Pseudonymised rather than dropped: the history features need a key that is
  # stable for one cardholder. -> client_key, HMAC with a secret pepper.
  pseudonymized: [cc_num]

  # Minimised rather than dropped, which EC17 allows. lat/long are the
  # cardholder's home and are constant for each of the 924 cardholders; only the
  # derived distance to the merchant is stored.
  minimized:
    f_home_distance_km: [lat, long, merch_lat, merch_long]

  # Dropped, each for a reason of its own. Argued in D9.
  excluded:
    city_pop: >-
      Quasi-identifier. 835 distinct values, of which 791 (94.7 %) designate a
      single city, and the value is constant per cardholder. Keeping it would
      undo the removal of city, state, zip, lat and long.
    gender: >-
      Protected characteristic. Not identifying on its own (250,833 M for
      304,886 F), but it would feed a scoring model, and a fraud score that
      differs by gender raises an equity question this dossier does not
      undertake to answer.
